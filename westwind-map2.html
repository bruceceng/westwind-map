<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manual Track Editor & Exporter</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Leaflet-Geoman CSS -->
    <link rel="stylesheet" href="https://unpkg.com/@geoman-io/leaflet-geoman-free@latest/dist/leaflet-geoman.css" />

    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: Arial, sans-serif; }
        #map { width: 100%; height: 100%; }
        
        #ui-panel {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(255, 255, 255, 0.95);
            padding: 15px;
            border-radius: 5px;
            z-index: 1000;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
            max-width: 260px;
        }

        button {
            width: 100%;
            margin-top: 10px;
            padding: 10px;
            background-color: #0078A8;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover { background-color: #005f85; }
        
        button#undo-btn {
            background-color: #d9534f;
        }
        button#undo-btn:hover {
            background-color: #c9302c;
        }

        button#split-mode-btn {
            background-color: #f0ad4e;
            color: #fff;
        }
        button#split-mode-btn.active {
            background-color: #d9534f;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.6; }
            100% { opacity: 1; }
        }
        
        .instructions {
            font-size: 0.8em;
            color: #555;
            margin-bottom: 10px;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <div id="ui-panel">
        <strong>Track Editor</strong>
        <div class="instructions">
            <ul>
                <li><strong>Split:</strong> Click "Toggle Split Mode", then click any vertex on a track to cut it in two.</li>
                <li><strong>Undo:</strong> Reverts any action (Ctrl+Z).</li>
            </ul>
        </div>
        <button id="split-mode-btn">Toggle Split Mode: OFF</button>
        <button id="undo-btn">⎌ Undo Last Action (Ctrl+Z)</button>
        <button id="export-btn">Export Results to JS</button>
    </div>

    <div id="map"></div>

    <!-- Leaflet JS Core -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Leaflet-Geoman JS -->
    <script src="https://unpkg.com/@geoman-io/leaflet-geoman-free@latest/dist/leaflet-geoman.min.js"></script>
    <!-- Your Data File -->
    <script src="data3.js"></script>

    <script>
        const map = L.map('map').setView([44.9582, -124.0179], 10);

        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 21,
            attribution: '© OpenStreetMap'
        }).addTo(map);

        // Geoman UI controls
        map.pm.removeControls();
        map.pm.addControls({
            position: 'topleft',
            drawCircle: false, drawCircleMarker: false, drawPolygon: false,
            drawRectangle: false, drawText: false, drawMarker: true,
            drawPolyline: true, editMode: true, dragMode: true, removalMode: true,
            cutPolygon: false
        });

        const dataLayer = L.featureGroup().addTo(map);

        const colors = ["#e6194b", "#3cb44b", "#4363d8", "#f58231", "#911eb4", "#42d4f4", "#f032e6", "#bfef45",'red','green','blue','yellow','purple','black'];
        let colorCounter = 0;
        let isSplitModeActive = false;

        // --- HISTORY / UNDO SYSTEM ---
        let undoStack = [];
        let isInternalUpdate = false;

        function saveState() {
            if (isInternalUpdate) return;
            
            let currentState = { tracks: [], waypoints: [] };

            dataLayer.eachLayer((layer) => {
                if (map.hasLayer(layer)) {
                    if (layer instanceof L.Polyline && !layer._url) {
                        currentState.tracks.push({
                            latlngs: layer.getLatLngs().map(ll => [ll.lat, ll.lng]),
                            color: layer.options.color || colors[0]
                        });
                    } else if (layer instanceof L.Marker && !layer._url) {
                        const ll = layer.getLatLng();
                        currentState.waypoints.push({
                            lat: ll.lat,
                            lon: ll.lng,
                            name: layer.waypointName || 'Waypoint'
                        });
                    }
                }
            });

            undoStack.push(currentState);
            if (undoStack.length > 25) undoStack.shift();
        }

        function performUndo() {
            if (undoStack.length <= 1) {
                alert("Nothing left to undo!");
                return;
            }

            isInternalUpdate = true;
            undoStack.pop(); 
            let previousState = undoStack[undoStack.length - 1]; 

            if (!previousState) {
                dataLayer.clearLayers();
                isInternalUpdate = false;
                return;
            }

            dataLayer.clearLayers();
            previousState.tracks.forEach(t => {
                L.polyline(t.latlngs, { color: t.color, weight: 4, opacity: 0.85 }).addTo(dataLayer);
            });
            previousState.waypoints.forEach(w => {
                const marker = L.marker([w.lat, w.lon]);
                marker.waypointName = w.name;
                marker.bindPopup(w.name);
                marker.addTo(dataLayer);
            });

            isInternalUpdate = false;
        }

        document.getElementById('undo-btn').addEventListener('click', performUndo);
        document.addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') {
                e.preventDefault();
                performUndo();
            }
        });

        // --- INITIAL DATA LOAD ---
        if (typeof filteredGpxData !== 'undefined') {
            if (filteredGpxData.tracks && filteredGpxData.tracks.length > 0) {
                filteredGpxData.tracks.forEach(trackPath => {
                    const color = colors[colorCounter++ % colors.length];
                    L.polyline(trackPath, { color: color, weight: 4, opacity: 0.85 }).addTo(dataLayer);
                });
            }
            if (filteredGpxData.waypoints && filteredGpxData.waypoints.length > 0) {
                filteredGpxData.waypoints.forEach(wpt => {
                    const marker = L.marker([wpt.lat, wpt.lon]);
                    marker.waypointName = wpt.name || 'Waypoint';
                    marker.bindPopup(marker.waypointName);
                    marker.addTo(dataLayer);
                });
            }
            if (dataLayer.getLayers().length > 0) {
                map.fitBounds(dataLayer.getBounds());
            }
        }

        setTimeout(saveState, 500);

        // --- CUSTOM SPLIT MODE LOGIC ---
        const splitBtn = document.getElementById('split-mode-btn');
        splitBtn.addEventListener('click', () => {
            isSplitModeActive = !isSplitModeActive;
            if (isSplitModeActive) {
                splitBtn.textContent = "Toggle Split Mode: ON (Click vertex)";
                splitBtn.classList.add('active');
                map.getContainer().style.cursor = 'crosshair';
            } else {
                splitBtn.textContent = "Toggle Split Mode: OFF";
                splitBtn.classList.remove('active');
                map.getContainer().style.cursor = '';
            }
        });

        dataLayer.on('click', (e) => {
            if (!isSplitModeActive) return;
            const clickedLayer = e.layer;
            
            if (!(clickedLayer instanceof L.Polyline)) return;

            const latlngs = clickedLayer.getLatLngs();
            if (latlngs.length < 3) {
                alert("This track is too short to split.");
                return;
            }

            let closestIndex = 0;
            let minDist = Infinity;
            latlngs.forEach((ll, idx) => {
                const dist = ll.distanceTo(e.latlng);
                if (dist < minDist) {
                    minDist = dist;
                    closestIndex = idx;
                }
            });

            if (closestIndex === 0 || closestIndex === latlngs.length - 1) {
                alert("Please click an interior point of the track to split it.");
                return;
            }

            const part1 = latlngs.slice(0, closestIndex + 1);
            const part2 = latlngs.slice(closestIndex);

            const color1 = clickedLayer.options.color || colors[colorCounter++ % colors.length];
            const color2 = colors[colorCounter++ % colors.length];

            dataLayer.removeLayer(clickedLayer);

            L.polyline(part1, { color: color1, weight: 4, opacity: 0.85 }).addTo(dataLayer);
            L.polyline(part2, { color: color2, weight: 4, opacity: 0.85 }).addTo(dataLayer);

            saveState();
            
            //isSplitModeActive = false;
            splitBtn.textContent = "Toggle Split Mode: OFF";
            splitBtn.classList.remove('active');
            map.getContainer().style.cursor = '';
            
            //alert("Track successfully split into two segments!");
        });

        // --- GEOMAN EVENT LISTENERS ---
        map.on('pm:create', (e) => {
            if (e.layer instanceof L.Polyline) {
                e.layer.setStyle({ color: colors[colorCounter++ % colors.length], weight: 4, opacity: 0.85 });
                dataLayer.addLayer(e.layer);
            } else if (e.layer instanceof L.Marker) {
                e.layer.waypointName = 'New Waypoint';
                e.layer.bindPopup(e.layer.waypointName);
                dataLayer.addLayer(e.layer);
            }
            saveState();
        });

        map.on('pm:edit', () => { saveState(); });
        map.on('pm:dragend', () => { saveState(); });
        
        map.on('pm:remove', (e) => {
            if (dataLayer.hasLayer(e.layer)) {
                dataLayer.removeLayer(e.layer);
            }
            saveState();
        });

        // --- EXPORT LOGIC ---
        document.getElementById('export-btn').addEventListener('click', () => {
            let exportData = { tracks: [], waypoints: [] };

            dataLayer.eachLayer((layer) => {
                if (map.hasLayer(layer)) {
                    if (layer instanceof L.Polyline && !layer._url) {
                        const latlngs = layer.getLatLngs();
                        if (Array.isArray(latlngs) && latlngs.length > 0) {
                            if (Array.isArray(latlngs[0])) {
                                latlngs.forEach(subArray => {
                                    exportData.tracks.push(subArray.map(ll => [ll.lat, ll.lng]));
                                });
                            } else {
                                exportData.tracks.push(latlngs.map(ll => [ll.lat, ll.lng]));
                            }
                        }
                    } else if (layer instanceof L.Marker && !layer._url) {
                        const latlng = layer.getLatLng();
                        exportData.waypoints.push({ 
                            lat: latlng.lat, 
                            lon: latlng.lng, 
                            name: layer.waypointName || 'Waypoint' 
                        });
                    }
                }
            });

            const jsContent = `const filteredGpxData = ${JSON.stringify(exportData, null, 2)};`;
            const blob = new Blob([jsContent], { type: 'text/javascript' });
            const url = URL.createObjectURL(blob);
            
            const a = document.createElement('a');
            a.href = url;
            a.download = 'filtered_data.js';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            
            alert("Successfully exported tracks and properly named waypoints to filtered_data.js!");
        });
    </script>
</body>
</html>
