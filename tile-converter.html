<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ZIP to JS Converter</title>
  <style>
    body { font-family: sans-serif; padding: 40px; background: #f4f4f9; }
    .card { background: white; padding: 24px; border-radius: 8px; max-width: 500px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    button { margin-top: 16px; padding: 10px 16px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
    #status { margin-top: 16px; font-weight: bold; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Map Tiles JS Generator</h2>
    <p>Select your <code>map_tiles.zip</code> to package it into a <code>tiles_data.js</code> file.</p>
    <input type="file" id="zipFileInput" accept=".zip">
    <br>
    <button id="convertBtn">Generate tiles_data.js</button>
    <div id="status"></div>
  </div>

  <script>
    document.getElementById('convertBtn').addEventListener('click', () => {
      const input = document.getElementById('zipFileInput');
      const status = document.getElementById('status');

      if (!input.files.length) {
        status.innerText = "Please select a zip file first.";
        return;
      }

      const file = input.files[0];
      status.innerText = "Reading file and encoding to Base64...";

      const reader = new FileReader();
      reader.onload = function(e) {
        const base64Data = e.target.result.split(',')[1];
        const jsContent = `window.MAP_TILES_BASE64 = "${base64Data}";`;

        const blob = new Blob([jsContent], { type: 'text/javascript' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'tiles_data.js';
        a.click();
        URL.revokeObjectURL(a.href);

        status.innerText = "Done! 'tiles_data.js' downloaded.";
      };

      reader.readAsDataURL(file);
    });

      document.head.appendChild(script);

  </script>
</body>
</html>
